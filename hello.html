<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Stock Insight</title>
  </head>
  <body>
    <div class="popup">
      <h1>Stock Insight</h1>
      <div class="summary" id="summary">Loading stock data...</div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Open</th>
            <th>Close</th>
            <th>High</th>
            <th>Low</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="chat-box">
        <h2>Ask the AI</h2>
        <div id="chat-output" class="chat-output"></div>
        <div class="chat-input-row">
          <input id="question" type="text" placeholder="e.g. What was the highest close?" />
          <button id="ask-btn">Ask</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
